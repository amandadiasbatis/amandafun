<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f0e2">
  <title>Amanda Funny Memory | Jogo da memória</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #193b32;
      --muted: #587268;
      --leaf: #28775c;
      --leaf-dark: #1d5c46;
      --lime: #d7ed71;
      --coral: #ed7658;
      --paper: #fffdf6;
      --line: #d9e8dc;
      --shadow: 0 18px 48px rgb(33 81 59 / 12%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: #e8f4e9;
      background-image: radial-gradient(#bddcc6 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(100% - 36px, 920px);
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 12px;
      background: var(--lime);
      font-size: 21px;
    }

    .edition {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .game-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .game-nav a {
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .game-nav a:hover, .game-nav a[aria-current="page"] {
      background: #e2eee3;
      color: var(--leaf-dark);
    }

    .intro { margin-bottom: 24px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--leaf);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 7vw, 58px);
      font-weight: 700;
      line-height: 1.05;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .game-panel {
      padding: clamp(18px, 4vw, 32px);
      border: 1px solid rgb(255 255 255 / 80%);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .game-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stat {
      min-width: 118px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f7fbf5;
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .stat-value {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .new-game {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      background: var(--leaf);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .new-game:hover { background: var(--leaf-dark); transform: translateY(-1px); }
    .new-game:focus-visible, .animal-card:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 14px);
      perspective: 1000px;
    }

    .animal-card {
      position: relative;
      display: grid;
      min-width: 0;
      aspect-ratio: 1 / 0.88;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 480ms cubic-bezier(.2, .75, .25, 1);
    }

    .animal-card.is-flipped, .animal-card.is-matched { transform: rotateY(180deg); }
    .animal-card:disabled { cursor: default; }

    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      background-color: #dff0df;
      background-image: radial-gradient(#b7d9be 1px, transparent 1px);
      background-size: 12px 12px;
      color: var(--leaf);
      font-size: clamp(23px, 5vw, 34px);
      transition: background-color 180ms ease;
    }

    .animal-card:hover:not(:disabled) .card-back { background-color: #d2eacd; }

    .card-front {
      background: #fff;
      transform: rotateY(180deg);
    }

    .card-front img {
      width: 100%;
      height: 100%;
      padding: 6px;
      object-fit: contain;
    }

    .animal-card.is-matched .card-front {
      border-color: #cf9bc4;
      background: #ebcfea;
      animation: match-pop 360ms ease both;
    }

    .status {
      min-height: 28px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .status.is-success {
      color: var(--leaf-dark);
      font-weight: 800;
    }

    @keyframes match-pop {
      50% { scale: 1.06; }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 24px, 440px); padding-top: 18px; }
      .topbar { margin-bottom: 26px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 10px; padding-bottom: 14px; }
      .game-nav a { padding: 7px 8px; font-size: 10px; }
      .game-panel { padding: 16px; border-radius: 16px; }
      .game-topline { align-items: stretch; flex-direction: column; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; }
      .stat { min-width: 0; }
      .new-game { width: 100%; }
      .board { gap: 8px; }
      .animal-card { aspect-ratio: 1 / 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🐾</span> Amanda Funny Memory</div>
      <nav class="game-nav" aria-label="Jogos">
        <a href="index.html" aria-current="page">Jogo da memória</a>
        <a href="quiz.html">Quiz dos planetas</a>
      </nav>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Observe · memorize · combine</p>
      <h1 id="page-title">Encontre os doguinhos</h1>
      <p class="subtitle">Vire as cartas e descubra o que está escondido.</p>
    </section>

    <section class="game-panel" aria-label="Jogo da memória de animais">
      <div class="game-topline">
        <div class="stats" aria-label="Placar">
          <div class="stat">
            <span class="stat-label">Tentativas</span>
            <span class="stat-value" id="attempts">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Pares</span>
            <span class="stat-value"><span id="pairs">0</span><span aria-hidden="true"> / 10</span></span>
          </div>
        </div>
        <button class="new-game" id="new-game" type="button"><span aria-hidden="true">↻</span> Novo jogo</button>
      </div>

      <div class="board" id="board" aria-label="Tabuleiro com 20 cartas"></div>
      <p class="status" id="status" role="status" aria-live="polite">Encontre os 10 pares para vencer.</p>
    </section>
  </main>

  <script>
    const images = [
      "animal1.jpeg", "animal2.jpg", "animal3.jpg", "animal4.jpeg", "animal5.jpg",
      "animal6.jpeg", "animal7.jpeg", "animal8.jpg", "animal9.jpg", "animal10.jpg"
    ];
    const board = document.querySelector("#board");
    const attemptsDisplay = document.querySelector("#attempts");
    const pairsDisplay = document.querySelector("#pairs");
    const statusDisplay = document.querySelector("#status");
    const newGameButton = document.querySelector("#new-game");

    let firstCard = null;
    let secondCard = null;
    let locked = false;
    let attempts = 0;
    let matchedPairs = 0;
    let mismatchTimer = null;

    function shuffledCards() {
      const cards = [...images, ...images];
      for (let index = cards.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [cards[index], cards[swapIndex]] = [cards[swapIndex], cards[index]];
      }
      return cards;
    }

    function createCard(imageName, index) {
      const card = document.createElement("button");
      card.className = "animal-card";
      card.type = "button";
      card.dataset.image = imageName;
      card.setAttribute("aria-label", `Carta ${index + 1}, fechada`);
      card.setAttribute("aria-pressed", "false");

      const back = document.createElement("span");
      back.className = "card-face card-back";
      back.setAttribute("aria-hidden", "true");
      back.textContent = "✳";

      const front = document.createElement("span");
      front.className = "card-face card-front";
      front.setAttribute("aria-hidden", "true");

      const image = document.createElement("img");
      image.src = `Animais/${encodeURIComponent(imageName)}`;
      image.alt = "";
      image.draggable = false;
      front.append(image);
      card.append(back, front);
      card.addEventListener("click", () => flipCard(card, index));
      return card;
    }

    function startGame() {
      window.clearTimeout(mismatchTimer);
      firstCard = null;
      secondCard = null;
      locked = false;
      attempts = 0;
      matchedPairs = 0;
      attemptsDisplay.textContent = "0";
      pairsDisplay.textContent = "0";
      statusDisplay.textContent = "Encontre os 10 pares para vencer.";
      statusDisplay.classList.remove("is-success");
      board.replaceChildren(...shuffledCards().map(createCard));
    }

    function flipCard(card, index) {
      if (locked || card === firstCard || card.classList.contains("is-matched")) return;

      card.classList.add("is-flipped");
      card.setAttribute("aria-pressed", "true");
      card.setAttribute("aria-label", `Carta ${index + 1}, imagem revelada`);

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      locked = true;
      attempts += 1;
      attemptsDisplay.textContent = String(attempts);

      if (firstCard.dataset.image === secondCard.dataset.image) {
        firstCard.classList.add("is-matched");
        secondCard.classList.add("is-matched");
        firstCard.disabled = true;
        secondCard.disabled = true;
        matchedPairs += 1;
        pairsDisplay.textContent = String(matchedPairs);
        firstCard = null;
        secondCard = null;
        locked = false;

        if (matchedPairs === images.length) {
          statusDisplay.textContent = `Parabéns! Você encontrou todos os pares em ${attempts} tentativas!`;
          statusDisplay.classList.add("is-success");
        } else {
          statusDisplay.textContent = "Par encontrado! Continue procurando.";
        }
        return;
      }

      statusDisplay.textContent = "Não foi dessa vez. Tente outra combinação.";
      mismatchTimer = window.setTimeout(() => {
        for (const hiddenCard of [firstCard, secondCard]) {
          hiddenCard.classList.remove("is-flipped");
          hiddenCard.setAttribute("aria-pressed", "false");
          hiddenCard.setAttribute("aria-label", `Carta ${Array.from(board.children).indexOf(hiddenCard) + 1}, fechada`);
        }
        firstCard = null;
        secondCard = null;
        locked = false;
        statusDisplay.textContent = "Encontre os 10 pares para vencer.";
      }, 850);
    }

    newGameButton.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
